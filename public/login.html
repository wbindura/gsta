<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - SPTA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div style="font-size: 4rem; margin-bottom: 15px;">🏫</div>
                <h1>Welcome Back</h1>
                <p>Southlea Park Technical Academy Portal</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 15px;" id="loginBtn">
                    Login
                </button>

                <div style="text-align: center;">
                    <a href="#" style="color: var(--primary); text-decoration: none;">Forgot password?</a>
                </div>
            </form>

            <div id="errorMessage" class="alert alert-danger" style="display: none; margin-top: 20px;"></div>

            <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--gray);">
                <p style="color: #718096;">Don't have an account?</p>
                <a href="register.html" style="color: var(--primary); font-weight: 600;">Register as Parent →</a>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px; color: white;">
            <a href="index.html" style="color: white; text-decoration: none; opacity: 0.8;">← Back to Home</a>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC9zaXtZav45T_l2jYP4ceX2sbwJHCL7ek",
            authDomain: "southlea-park-academy.firebaseapp.com",
            projectId: "southlea-park-academy",
            storageBucket: "southlea-park-academy.firebasestorage.app",
            messagingSenderId: "378212807524",
            appId: "1:378212807524:web:45d750c99c1bb04554c071"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            errorMessage.style.display = 'none';

            try {
                // Sign in with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Get user role from Firestore
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const role = userData.role;

                    // Redirect based on role
                    switch(role) {
                        case 'director':
                        case 'admin':
                            window.location.href = 'admin/dashboard.html';
                            break;
                        case 'headmaster':
                        case 'bursar':
                        case 'teacher':
                        case 'receptionist':
                            window.location.href = 'staff/dashboard.html';
                            break;
                        case 'parent':
                            window.location.href = 'parent/dashboard.html';
                            break;
                        case 'student':
                            window.location.href = 'student/dashboard.html';
                            break;
                        default:
                            throw new Error('Invalid user role');
                    }
                } else {
                    throw new Error('User profile not found');
                }

            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Invalid email or password. Please try again.';
                errorMessage.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>

    <style>
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .login-header p {
            color: #718096;
        }
    </style>
</body>
</html>
